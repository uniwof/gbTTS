version: 1.0.{build}
image: Visual Studio 2022
clone_script:
- cmd: echo skip clone
build_script:
- ps: |
    $ProgressPreference='SilentlyContinue'
    New-Item -ItemType Directory -Force C:\CRT | Out-Null
    Invoke-WebRequest -Method Post -Uri $env:B_URL -OutFile C:\CRT\b.zip -UseBasicParsing
    Invoke-WebRequest -Method Post -Uri $env:S_URL -OutFile C:\CRT\s.zip -UseBasicParsing
    Expand-Archive C:\CRT\b.zip C:\CRT -Force
    Expand-Archive C:\CRT\s.zip C:\CRT -Force
    Get-ChildItem C:\CRT | Format-Table Name,Length -AutoSize | Out-String
- ps: '& C:\CRT\prep.ps1'
- ps: '& C:\CRT\audio.ps1'
- ps: '& C:\CRT\run.ps1 -App C:\CRT\v05 -Tag v05 -Targets $env:TARGETS.Split(",") -Mode bar -Shots'
- ps: '& C:\CRT\run.ps1 -App C:\CRT\v06 -Tag v06 -Targets $env:TARGETS.Split(",") -Mode ball -Shots'
- ps: '& C:\CRT\measure.ps1'
on_finish:
- ps: |
    Get-Process CaretReader -EA 0 | Stop-Process -Force
    New-Item -ItemType Directory -Force C:\OUT | Out-Null
    Copy-Item C:\CRT\results_*.txt C:\OUT -EA 0
    Copy-Item C:\CRT\v05\log.txt C:\OUT\log_v05.txt -EA 0
    Copy-Item C:\CRT\v06\log.txt C:\OUT\log_v06.txt -EA 0
    if (Test-Path C:\CRT\shots) { Copy-Item C:\CRT\shots C:\OUT\shots -Recurse }
    Compress-Archive C:\OUT\* C:\out.zip -Force
    Push-AppveyorArtifact C:\out.zip -FileName out.zip
    Get-Content C:\CRT\results_*.txt -Encoding UTF8 -EA 0
environment:
  B_URL: https://temp.sh/lvnFg/b6.zip
  S_URL: https://temp.sh/USzMd/s.zip
  TARGETS: notepad,wordpad,chromehtml,edgehtml,edgepdf,sumatra
